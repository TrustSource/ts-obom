[build-system]
requires = [
    'setuptools>=61.0'
]
build-backend = 'setuptools.build_meta'

[project]
name = 'ts-obom'
version = '0.3.0'
authors = [
    { name='EACG GmbH' }
]
description = 'TrustSource OBOM scanner: extracts a CycloneDX Operations Bill of Materials from infrastructure-as-code'
readme = 'README.md'
requires-python = '>=3.10'
classifiers = []
keywords = ['obom', 'cyclonedx', 'iam', 'access graph', 'infrastructure as code', 'cloudformation', 'terraform', 'opentofu', 'compliance', 'TrustSource']
license = 'Apache-2.0'

dependencies = [
    "click==8.1.7",
    "toml~=0.10.2",
    "wasabi~=1.1.3",
    # Dependencies of the vendored checkov graph-builder subset in
    # src/ts_obom/_vendor/checkov/. This is NOT the checkov PyPI package,
    # see src/ts_obom/obom.py and src/ts_obom/_vendor/NOTICE.md.
    "bc-python-hcl2>=0.4",
    # CycloneDX output: used by the vendored checkov exporter and by
    # ts_obom.cyclonedx on top of it.
    "cyclonedx-python-lib>=7.6,<8",
    "packageurl-python>=0.11",
    "termcolor>=2.0",
    "bc-jsonpath-ng>=1.6",
    "networkx>=2.6",
    "dpath>=2.1",
    "asteval>=0.9",
    "PyYAML>=6.0",
    "requests>=2.31",
    "packaging>=23.0",
    "typing-extensions>=4.4",
    "tqdm>=4.66",
    "colorama>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.390",
]

[project.urls]
Homepage = 'https://github.com/trustsource/ts-obom.git'
Documentation = 'https://trustsource.github.io/ts-obom'

[project.scripts]
ts-obom = "ts_obom.cli:start"

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
"ts_obom._vendor" = ["NOTICE.md", "checkov/LICENSE"]

[tool.pytest.ini_options]
testpaths = ['tests']
