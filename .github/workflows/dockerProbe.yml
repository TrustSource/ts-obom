# Temporary diagnostic. Asks Docker Hub what the credentials in DOCKERHUB_USERNAME
# and DOCKER_ACCESS actually resolve to, and which actions the registry grants for
# trustsource/ts-obom. Prints no secret -- only the identity and the granted scope,
# both of which are exactly what the push already tells the world when it fails.
# Delete once the release push works.
name: dockerProbe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the registry what we may do
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_ACCESS }}
        run: |
          set -euo pipefail

          if [ -z "${DOCKER_USER}" ]; then echo "DOCKERHUB_USERNAME is empty"; exit 1; fi
          if [ -z "${DOCKER_PAT}" ]; then echo "DOCKER_ACCESS is empty"; exit 1; fi
          echo "username secret length: ${#DOCKER_USER}, token secret length: ${#DOCKER_PAT}"

          for repo in trustsource/ts-obom trustsource/ts-scan; do
            echo
            echo "=== ${repo} ==="
            jwt=$(curl -s -u "${DOCKER_USER}:${DOCKER_PAT}" \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull,push" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))')

            if [ -z "$jwt" ]; then echo "  no token issued"; continue; fi

            python3 - "$jwt" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print('  authenticated as :', claims.get('sub') or claims.get('account') or '(anonymous)')
          access = claims.get('access') or []
          if not access:
              print('  granted actions  : NONE')
          for entry in access:
              print('  granted actions  :', entry.get('name'), '->', entry.get('actions'))
          PY
          done
